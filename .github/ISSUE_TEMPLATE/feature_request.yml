name: Feature request or new skill
description: Propose a new skill, a new flag, or a change to how a skill behaves.
labels: [enhancement]
body:
  - type: input
    id: skill
    attributes:
      label: Skill
      description: An existing skill name, or "new" for a new skill.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The workflow or situation, and where the current skills fall short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What you would type, and what Claude should do in response.
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'm willing to open a pull request for this.
